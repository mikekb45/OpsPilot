secrets:
  anthropic_api_key:
    file: ./anthropic_api_key.txt

services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  harness:
    build:
      context: .
      dockerfile: harness/Dockerfile
    environment:
      REDIS_HOST: redis
      MCP_SERVER_URL: http://mcp-server:8000/mcp
    secrets:
      - anthropic_api_key
    depends_on:
      - redis
      - mcp-server

  mcp-server:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    ports:
      - "8000:8000"
